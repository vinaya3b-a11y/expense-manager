<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devashetty Vinay Expense manager</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --primary: #2c3e50;
            --income: #2ecc71;
            --expense: #e74c3c;
            --border: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 5px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        /* Summary Cards Layout */
        .summary-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid var(--border);
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
        }

        .card p {
            margin: 0;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .balance { color: var(--primary); }
        .income { color: var(--income); }
        .expense { color: var(--expense); }

        /* Main Workspace Layout */
        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 850px) {
            .main-content {
                grid-template-columns: 1fr 1.2fr;
            }
        }

        .panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--primary);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .inline-group {
            display: flex;
            gap: 10px;
        }

        .inline-group input {
            flex: 2;
        }

        .inline-group button {
            flex: 1;
            white-space: nowrap;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            font-size: 1rem;
            margin-top: 10px;
        }

        .btn-secondary {
            background-color: #7f8c8d;
            color: white;
        }

        .btn-export {
            background-color: #27ae60;
            color: white;
            font-size: 0.85rem;
        }

        /* Ledger Transactions styling */
        .transaction-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            max-height: 520px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background-color: var(--bg-color);
            border-radius: 4px;
            font-size: 0.95rem;
            border-left: 5px solid transparent;
        }

        .transaction-item.plus { border-left-color: var(--income); }
        .transaction-item.minus { border-left-color: var(--expense); }

        .item-details {
            display: flex;
            flex-direction: column;
        }

        .item-title { font-weight: 600; }
        .item-meta {
            font-size: 0.75rem;
            color: #7f8c8d;
            margin-top: 2px;
        }

        .item-meta span {
            background: #e0e0e0;
            padding: 1px 5px;
            border-radius: 3px;
            margin-right: 5px;
            color: #333;
        }

        .item-amount-zone {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--expense);
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Devashetty Vinay Expense manager</h1>
    <p class="subtitle">Daily Income & Expense Tracking Hub</p>

    <!-- Automated Calculation Summary Cards -->
    <div class="summary-container">
        <div class="card">
            <h3>Net Cash In Hand</h3>
            <p id="total-balance" class="balance">₹0.00</p>
        </div>
        <div class="card">
            <h3>Total Income (+)</h3>
            <p id="total-income" class="income">₹0.00</p>
        </div>
        <div class="card">
            <h3>Total Expenses (-)</h3>
            <p id="total-expense" class="expense">₹0.00</p>
        </div>
    </div>

    <!-- UI Core Workspace Layout -->
    <div class="main-content">
        <div>
            <!-- Transaction Submission Panel -->
            <div class="panel">
                <h2>Add Transaction</h2>
                <form id="budget-form">
                    <div class="form-group">
                        <label for="text">Description</label>
                        <input type="text" id="text" placeholder="e.g., Monthly Salary, Grocery Bill" required />
                    </div>
                    <div class="form-group">
                        <label for="type">Transaction Type</label>
                        <select id="type" onchange="renderCategoryDropdown()">
                            <option value="expense">Expenditure (-)</option>
                            <option value="income">Income (+)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <!-- Populated Dynamically -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Transaction Date</label>
                        <input type="date" id="date" required />
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" step="0.01" placeholder="0.00" required />
                    </div>
                    <button type="submit" class="btn-submit">Log Transaction</button>
                </form>
            </div>

            <!-- Dynamic Category Management Custom Tools Configuration Panel -->
            <div class="panel">
                <h2>Configure Custom Categories</h2>
                <div class="form-group">
                    <label for="new-cat-type">Target Allocation Setup</label>
                    <select id="new-cat-type">
                        <option value="expense">Expenditure Category</option>
                        <option value="income">Income Category</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="new-cat-name">New Category Title</label>
                    <div class="inline-group">
                        <input type="text" id="new-cat-name" placeholder="e.g., Fuel, Side Hustle" />
                        <button type="button" class="btn-secondary" onclick="addNewCategory()">Add Custom</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ledger History Logs View Box Window Panel -->
        <div class="panel" style="margin-bottom: auto;">
            <h2>
                Transaction Ledger Log 
                <button class="btn-export" onclick="exportToCSV()">Export Excel CSV</button>
            </h2>
            <ul id="transaction-list" class="transaction-list">
                <!-- Javascript maps data rows here dynamically -->
            </ul>
        </div>
    </div>
</div>
